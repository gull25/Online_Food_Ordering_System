services:
    mongo:
        image: mongo:8
        container_name: foodora-mongo
        restart: unless-stopped
        ports:
            - "${MONGO_PORT:-27017}:27017"
        environment:
            # Root account, created only on first run (empty volume).
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
            MONGO_INITDB_DATABASE: ${MONGO_DB:-foodora}
            # Consumed by docker/mongo/init/01-create-app-user.js
            MONGO_APP_USER: ${MONGO_APP_USER:-foodora_app}
            MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-foodora_app_password}
        volumes:
            - mongo-data:/data/db
            - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    # Optional web UI for browsing the data: `docker compose --profile tools up -d`
    mongo-express:
        image: mongo-express:1.0.2
        container_name: foodora-mongo-express
        restart: unless-stopped
        profiles: ["tools"]
        depends_on:
            mongo:
                condition: service_healthy
        ports:
            - "${MONGO_EXPRESS_PORT:-8081}:8081"
        environment:
            ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongo:27017/?authSource=admin
            ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
            ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}

volumes:
    mongo-data:
